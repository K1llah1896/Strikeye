name: Release

# Builds the Windows executables and publishes them to a GitHub Release whenever
# a version tag (v*) is pushed. The asset layout matches what the in-app updater
# (internal/updater) expects: a zip whose name contains "windows" and "amd64",
# holding strikeye.exe plus the map_geometry.zip sidecar with the bundled collision geometry and the
# ffmpeg-*/hlae-* archives that used to be downloaded from the settings page.
# Everything a fresh install needs is inside the zip: no runtime downloads.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Tags containing a "-" (e.g. v0.2.0-rc1) are published as prereleases, so
# /releases/latest keeps pointing at the newest stable build.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build windows/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${tag}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::tag '${tag}' is not semver-like (expected vX.Y.Z)"; exit 1
          fi
          version="${tag#v}"
          prerelease=false
          if [[ "${tag}" == *-* ]]; then prerelease=true; fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Map datasets and external tools are build inputs, not sources: they are
      # git-ignored and must be fetched before anything compiles, because the nav
      # mesh and callout blobs are embedded with go:embed. The collision geometry
      # (~200 MB) and the FFmpeg/HLAE archives are written as sidecars that ship
      # inside the release zip, so a fresh install never downloads anything.
      - name: Bundle map assets and tools
        run: |
          set -euo pipefail
          go run ./cmd/strikeye-cli assets-pack \
            --asset-dir internal/mapassets/assets \
            --geometry-out dist \
            --tools-out dist
          ls -l internal/mapassets/assets dist/map_geometry.zip dist/*-windows-amd64.*

      - name: Vet and test
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./...

      # GOOS/GOARCH are scoped to this step only: `go test` above must run natively.
      - name: Build executables
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # -s -w drops the symbol table and DWARF data: ~18% off every binary,
          # and nothing in the app reads either.
          ldflags="-s -w -X strikeye/internal/version.AppVersion=${VERSION}"
          # One binary carries every entry point: the desktop shell by default,
          # `strikeye agent` for the headless service, `strikeye cli <command>`
          # for the command line. Console subsystem on purpose: cmd.exe and
          # PowerShell only wait for console applications, so `strikeye cli …`
          # has to be one — the shell hides its own console window instead.
          go build -trimpath -ldflags "${ldflags}" -o dist/strikeye.exe ./cmd/strikeye
          ls -l dist

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          out="strikeye-windows-amd64.zip"
          rm -f "$out"
          # Executables compress to ~55% of their size, so they get the slow
          # setting; the sidecars are already compressed (gzip map data, zstd
          # FFmpeg, upstream HLAE zip) and are stored as-is to keep packaging
          # fast instead of burning minutes to save nothing.
          zip -9 -X "$out" strikeye.exe
          zip -0 -X "$out" map_geometry.zip ffmpeg-windows-amd64.tar.zst hlae-windows-amd64.zip
          zip -T "$out"
          sha256sum "$out" > SHA256SUMS.txt
          ls -l "$out"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=(dist/strikeye-windows-amd64.zip dist/SHA256SUMS.txt)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            args=(--title "${TAG}" --generate-notes --verify-tag)
            if [[ "${PRERELEASE}" == "true" ]]; then args+=(--prerelease); else args+=(--latest); fi
            gh release create "${TAG}" "${assets[@]}" "${args[@]}"
          fi
          echo "Released ${TAG}"
