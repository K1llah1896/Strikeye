name: Release

# Builds the Windows executables and publishes them to a GitHub Release whenever
# a version tag (v*) is pushed. The asset layout matches what the in-app updater
# (internal/updater) expects: a zip whose name contains "windows" and "amd64",
# holding strikeye.exe / strikeye-agent.exe / strikeye-cli.exe.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Tags containing a "-" (e.g. v0.2.0-rc1) are published as prereleases, so
# /releases/latest keeps pointing at the newest stable build.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build windows/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${tag}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::tag '${tag}' is not semver-like (expected vX.Y.Z)"; exit 1
          fi
          version="${tag#v}"
          prerelease=false
          if [[ "${tag}" == *-* ]]; then prerelease=true; fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and test
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./...

      # GOOS/GOARCH are scoped to this step only: `go test` above must run natively.
      - name: Build executables
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-X strikeye/internal/version.AppVersion=${VERSION}"
          # Desktop shell: GUI subsystem so no console window flashes on start.
          go build -trimpath -ldflags "${ldflags} -H windowsgui" -o dist/strikeye.exe ./cmd/strikeye
          go build -trimpath -ldflags "${ldflags}" -o dist/strikeye-agent.exe ./cmd/strikeye-agent
          go build -trimpath -ldflags "${ldflags}" -o dist/strikeye-cli.exe ./cmd/strikeye-cli
          ls -l dist

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          zip -9 "strikeye-windows-amd64.zip" strikeye.exe strikeye-agent.exe strikeye-cli.exe
          sha256sum "strikeye-windows-amd64.zip" > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=(dist/strikeye-windows-amd64.zip dist/SHA256SUMS.txt)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            args=(--title "${TAG}" --generate-notes --verify-tag)
            if [[ "${PRERELEASE}" == "true" ]]; then args+=(--prerelease); else args+=(--latest); fi
            gh release create "${TAG}" "${assets[@]}" "${args[@]}"
          fi
          echo "Released ${TAG}"
